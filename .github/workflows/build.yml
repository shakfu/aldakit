name: Build and Publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI"
        type: boolean
        default: false
      prerelease:
        description: "Upload wheels to a GitHub prerelease"
        type: boolean
        default: false

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU (for Linux aarch64)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        # Configuration is in pyproject.toml [tool.cibuildwheel]

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  collect_artifacts:
    name: Collect all artifacts
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List all artifacts
        run: ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: all-dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: [collect_artifacts]
    runs-on: ubuntu-latest
    if: inputs.publish
    environment:
      name: pypi
      url: https://pypi.org/p/aldakit
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: all-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  prerelease:
    name: Create GitHub prerelease
    needs: [collect_artifacts]
    runs-on: ubuntu-latest
    if: inputs.prerelease
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get version from pyproject.toml
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: all-dist
          path: dist

      - name: Create tag and prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git tag -f "$tag"
          git push -f origin "$tag"
          gh release create "$tag" dist/* \
            --title "aldakit $tag" \
            --prerelease \
            --generate-notes
