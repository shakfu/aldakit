name: Build and Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI"
        type: boolean
        default: false
      prerelease:
        description: "Upload wheels to a GitHub prerelease"
        type: boolean
        default: false

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The ends of the supported range on every platform: an OS-specific
        # problem (ALSA, CoreMIDI, WinMM, the MSVC runtime) rarely depends on
        # the Python version, and 3.10 and 3.14 are the two the wheels are
        # built for at either end.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
        include:
          # The middle of the range on the cheapest runner: a problem that
          # depends on the Python version rarely also depends on the OS.
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install ALSA headers (libremidi)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check src/ tests/ scripts/

      - name: Typecheck
        run: uv run ty check src/aldakit/

      - name: Test
        run: uv run pytest tests/ -q

  audio:
    name: Golden audio on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Two platforms is enough to catch a real change in what the
        # synthesizer produces while keeping the render time off the critical
        # path of every job in the matrix above.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install ALSA headers (libremidi)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Install project
        run: uv sync

      # The fixtures are pinned to one SoundFont, a 6 MB asset on this
      # repository's own soundfonts-v1 release. Cache it so that most runs
      # fetch nothing at all, keyed on the catalog so that changing the
      # pinned SoundFont or its checksum fetches the new one.
      - name: Cache the pinned SoundFont
        uses: actions/cache@v6
        with:
          path: ~/.aldakit/soundfonts
          key: soundfont-TimGM6mb-${{ hashFiles('src/aldakit/midi/soundfont.py') }}

      # On a cache hit this is a no-op. On a miss it fetches 6 MB from the
      # soundfonts-v1 release, so a transient failure gets two more chances
      # before the job goes red over a blip.
      - name: Install the pinned SoundFont
        run: |
          for attempt in 1 2 3; do
            if uv run aldakit soundfont install TimGM6mb; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::Could not download the pinned SoundFont after 3 tries"
          exit 1

      # ALDAKIT_REQUIRE_AUDIO_FIXTURES turns "no SoundFont, nothing to
      # compare" from a skip into a failure: a green tick for a comparison
      # that never ran is worse than no comparison at all.
      - name: Compare rendered audio against the fixtures
        env:
          ALDAKIT_REQUIRE_AUDIO_FIXTURES: "1"
        run: uv run pytest tests/test_golden_audio.py tests/test_render.py -q

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up QEMU (for Linux aarch64)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        # Configuration is in pyproject.toml [tool.cibuildwheel]

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  collect_artifacts:
    name: Collect all artifacts
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List all artifacts
        run: ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: all-dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: [collect_artifacts]
    runs-on: ubuntu-latest
    if: inputs.publish
    environment:
      name: pypi
      url: https://pypi.org/p/aldakit
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: all-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  prerelease:
    name: Create GitHub prerelease
    needs: [collect_artifacts]
    runs-on: ubuntu-latest
    if: inputs.prerelease
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Get version from pyproject.toml
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: all-dist
          path: dist

      - name: Create tag and prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git tag -f "$tag"
          git push -f origin "$tag"
          gh release create "$tag" dist/* \
            --title "aldakit $tag" \
            --prerelease \
            --generate-notes
